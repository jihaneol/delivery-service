spring:
  application:
    name: delivery

  datasource:
    url: jdbc:postgresql://localhost:5432/delivery
    username: delivery
    password: delivery1234

  # 페이징 (size 상한을 두어 한 번에 너무 많이 가져오지 못하게 한다)
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-at-least-32-bytes!!}
  expiration-ms: 3600000
